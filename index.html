    margin: 0; background: var(--bg); color: var(--text);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #1fa463; }

  /* ヘッダー */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: linear-gradient(120deg, #1fa463, #17b3a0); color: #fff;
    padding-block: 10px 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-radius: 0 0 20px 20px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 8px;
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: .06em; white-space: nowrap; }
  header h1 { display: flex; align-items: center; gap: 6px; }
  header .logo { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .25)); }
  .app-version { font-size: 10px; font-weight: 700; color: rgba(255, 255, 255, .72); margin-left: 2px; letter-spacing: 0; }
  header h1 small { font-size: 12px; font-weight: 700; opacity: .85; margin-left: 4px; }
  .year-pill {
    appearance: none; -webkit-appearance: none; border: none; border-radius: 999px;
    background: rgba(255,255,255,.22); color: #fff; font-weight: 800; font-size: 15px; padding: 4px 12px;
  }
  .year-pill option { color: #1f2d24; }
  #sync { flex: 1; min-width: 0; font-size: 11px; font-weight: 700; opacity: .9; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1, .year-pill, #adminBtn { flex: none; }
  #adminBtn {
    border: none; border-radius: 999px; background: #fff; color: var(--green-dark);
    font-weight: 800; font-size: 13px; padding: 6px 12px; white-space: nowrap;
  }
  #adminBtn.on { background: var(--sun); color: #5a3d00; }

  main {
    padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 960px; margin: 0 auto;
  }

  /* 下部タブ */
  nav#tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; justify-content: space-around;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px));
    padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
    box-shadow: 0 -2px 12px rgba(30, 80, 50, .08);
  }
  nav#tabs button {
    flex: 1; border: none; background: none; border-radius: 14px; padding: 4px 0 2px;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; max-width: 120px;
  }
  nav#tabs button .ic { font-size: 22px; line-height: 1.2; filter: grayscale(.6); opacity: .75; transition: transform .15s; }
  nav#tabs button.on { color: var(--green-dark); background: var(--green-soft); }
  nav#tabs button.on .ic { filter: none; opacity: 1; transform: scale(1.12); }

  /* 共通パーツ */
  h2 { font-size: 19px; font-weight: 800; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
  h3 { font-size: 16px; font-weight: 800; margin: 24px 0 10px; display: flex; align-items: center; gap: 6px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .btn {
    border: none; border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 800; cursor: pointer;
    background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  }
  .btn.primary { background: var(--green); color: var(--on-green); }
  .btn.sun { background: var(--sun); color: #5a3d00; }
  .btn.ghost { box-shadow: none; background: var(--surface-2); }
  .btn.danger { background: var(--pink-soft); color: var(--minus); box-shadow: none; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.wide { width: 100%; }
  .seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
  .seg button { border: none; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--green); color: var(--on-green); }
  input[type=text], input[type=number], input[type=date], input[type=password], input[type=url] {
    font-size: 16px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--text); outline: none; min-width: 0;
  }
  input:focus { border-color: var(--green); }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .meta .field { min-width: 0; }
  .meta .field input { width: 100%; min-width: 0; max-width: 100%; }
  /* iPhone の日付欄は中身の幅より縮まず隣にはみ出すので、標準の見た目を外して幅に収める */
  .meta input[type=date] { -webkit-appearance: none; appearance: none; display: block; height: 42px; text-align: left; }
  .meta input[type=date]::-webkit-date-and-time-value { text-align: left; }
  @media (max-width: 480px) {
    .meta .field.wide { grid-column: 1 / -1; }
  }
  input.num { width: 4.4em; text-align: center; }
  input.money { width: 6.5em; text-align: right; }
  .field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px;
    font-size: 12px; font-weight: 800; background: var(--surface-2); color: var(--muted); white-space: nowrap;
  }
  .chip.green { background: var(--green-soft); color: var(--green-dark); }
  .chip.sun { background: var(--sun-soft); color: var(--sun-text); }
  .chip.pink { background: var(--pink-soft); color: var(--minus); }
  .chip.sky { background: var(--sky-soft); color: var(--sky); }
  .card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; }
  .hidden { display: none !important; }
  .warn { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--pink-soft); color: var(--minus); font-size: 13px; font-weight: 700; line-height: 1.6; }

  /* 大会一覧 */
  .round-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .round-card { display: flex; gap: 14px; align-items: center; border: none; text-align: left; cursor: pointer; width: 100%; font-size: 14px; }
  .round-card:active { transform: scale(.98); }
  .date-bubble {
    flex: none; width: 58px; height: 58px; border-radius: 18px; background: var(--green-soft); color: var(--green-dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  }
  .date-bubble b { font-size: 20px; font-weight: 800; }
  .date-bubble span { font-size: 11px; font-weight: 700; }
  .round-card .t { font-weight: 800; font-size: 16px; }
  .round-card .w { margin-top: 2px; font-weight: 700; }
  .round-card.latest .date-bubble { background: var(--sun); color: #5a3d00; }

  /* 表彰台 */
  .podium { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 16px; }
  .podium .p { border-radius: 18px; padding: 12px; text-align: center; box-shadow: var(--shadow); }
  .podium .p1, .podium .p2:only-of-type, .podium .p2:last-child:nth-child(2) { grid-column: 1 / -1; }
  .podium .p1 { background: linear-gradient(135deg, #ffe27a, #ffc93c); color: #4a3200; }
  .podium .p2 { background: linear-gradient(135deg, #f3f6f9, #d5dde5); color: #2c3742; }
  .podium .medal { font-size: 30px; line-height: 1.1; }
  .podium .p1 .medal { font-size: 40px; }
  .podium .nm { font-size: 18px; font-weight: 800; }
  .podium .p1 .nm { font-size: 24px; }
  .podium .sub { font-size: 12px; font-weight: 700; opacity: .8; }
  .podium .yen { font-size: 18px; font-weight: 800; }
  .podium .p1 .yen { font-size: 24px; }

  /* 順位リスト */
  .rank-list { display: flex; flex-direction: column; gap: 8px; }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .badge {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; background: var(--surface-2); color: var(--muted);
  }
  .badge.r1 { background: var(--sun); color: #5a3d00; }
  .badge.r2 { background: var(--silver); color: #fff; }
  .badge.r3 { background: var(--bronze); color: #fff; }
  .rank-row .who { flex: 1; min-width: 0; }
  .rank-row .who .nm { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-row .who .sub { font-size: 12px; color: var(--muted); }
  .rank-row .net { text-align: right; }
  .rank-row .net b { font-size: 22px; font-weight: 800; }
  .rank-row .net small { display: block; font-size: 10px; color: var(--muted); font-weight: 700; margin-top: -4px; }

  /* 幹事入力カード */
  .summary { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
  .entry-list { display: flex; flex-direction: column; gap: 8px; }
  .entry { padding: 10px 12px; transition: background .2s; }
  .entry .top { display: flex; align-items: center; gap: 10px; }
  .entry .nm { flex: 1; font-weight: 800; font-size: 16px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .res { display: flex; gap: 4px; align-items: center; }
  .entry .body { display: none; margin-top: 10px; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .entry.on .body { display: flex; }
  .entry:not(.on) { background: var(--surface-2); box-shadow: none; }
  .entry:not(.on) .nm { color: var(--muted); font-weight: 700; }
  .entry input.score { width: 5em; font-size: 22px; font-weight: 800; text-align: center; padding: 6px; }
  .entry input.hc { width: 3.6em; text-align: center; }
  .entry input.hc.override { border-color: var(--pink); background: var(--pink-soft); }
  .entry .calc { font-size: 12px; color: var(--muted); font-weight: 700; display: flex; flex-direction: column; align-items: center; min-width: 3em; }
  .entry .calc b { font-size: 18px; color: var(--text); }
  .toggle { position: relative; cursor: pointer; user-select: none; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle span {
    display: inline-block; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 800;
    background: var(--surface); color: var(--muted); border: 2px solid var(--line); white-space: nowrap;
  }
  .toggle input:checked + span { background: var(--green); border-color: var(--green); color: var(--on-green); }
  .toggle.paid input:checked + span { background: var(--sky); border-color: var(--sky); color: #fff; }
  .toggle input:focus-visible + span { outline: 2px solid var(--green-dark); outline-offset: 2px; }
  .filter { position: sticky; top: 64px; z-index: 5; padding: 6px 0; background: var(--bg); }

  /* 表 */
  .scroll { overflow: auto; -webkit-overflow-scrolling: touch; max-width: 100%; max-height: calc(100vh - 200px); max-height: calc(100dvh - 200px); overscroll-behavior: contain; border-radius: 16px; box-shadow: var(--shadow); background: var(--surface); }
  table { border-collapse: separate; border-spacing: 0; font-size: 14px; white-space: nowrap; width: 100%; }
  th, td { padding: 8px 9px; text-align: right; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: none; }
  th { background: var(--green-soft); color: var(--green-dark); font-size: 11px; font-weight: 800; text-align: center; line-height: 1.3; position: sticky; top: 0; z-index: 2; }
  td.name, th.name { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--surface); font-weight: 800; box-shadow: 2px 0 4px rgba(0,0,0,.05); }
  th.name { background: var(--green-soft); z-index: 3; }
  tbody tr:nth-child(even) td { background: var(--surface-2); }
  td.c { text-align: center; }
  tr.total td { font-weight: 800; background: var(--green-soft) !important; }
  .filled { color: var(--pink); font-style: italic; }
  .override { background: var(--pink-soft) !important; }
  .win { color: var(--sun-text); font-weight: 800; }
  td.win { background: var(--sun-soft) !important; }
  .second { color: var(--silver-text); font-weight: 800; }
  td.second { background: var(--silver-soft) !important; }
  td input.num.override { border-color: var(--pink); background: var(--pink-soft); }
  .minus { color: var(--minus); }
  .king { background: var(--sun); color: #5a3d00; font-weight: 800; border-radius: 999px; padding: 0 7px; font-size: 11px; }

  /* 賞金王カード */
  .hero { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, #ffe27a, #ffc93c); color: #4a3200; margin-bottom: 14px; }
  .hero .big { font-size: 42px; line-height: 1; }
  .hero .nm { font-size: 20px; font-weight: 800; }
  .hero .yen { font-size: 15px; font-weight: 800; }
  .mini-rank { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .mini-rank .card { padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
  .mini-rank .badge { width: 28px; height: 28px; font-size: 13px; }
  .mini-rank .nm { font-weight: 800; font-size: 14px; }
  .mini-rank .yen { font-size: 12px; color: var(--muted); font-weight: 700; }

  .rule { font-size: 13px; margin: 6px 0; padding-left: 1.4em; text-indent: -1.4em; }
  .rules { padding: 12px 16px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 700;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 50; white-space: nowrap;
  }
  #toast.show { opacity: .95; transform: translateX(-50%) translateY(0); }
  dialog { border: none; border-radius: 20px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); padding: 20px; width: min(340px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(10, 30, 20, .45); }
  dialog p { margin: 0 0 10px; font-weight: 800; font-size: 17px; }
  dialog input, dialog textarea { width: 100%; }
  dialog p { white-space: pre-line; }
  textarea { font-size: 14px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); resize: vertical; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* PDF用の紙面（画面外で描いて画像化する。印刷物なのでテーマに関係なく明るい配色で固定） */
  .report {
    position: fixed; left: -10000px; top: 0; width: 794px; background: #ffffff; color: #1f2d24;
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif; font-size: 15px; line-height: 1.45;
  }
  .report .rp-head {
    background: linear-gradient(120deg, #1fa463, #17b3a0); color: #ffffff; padding: 26px 40px 30px;
    border-radius: 0 0 36px 36px; position: relative; overflow: hidden;
  }
  .report .rp-head::after {
    content: ""; position: absolute; right: -60px; top: -70px; width: 240px; height: 240px; border-radius: 50%;
    background: rgba(255, 255, 255, .12);
  }
  .report .rp-club { font-size: 16px; font-weight: 800; letter-spacing: .12em; display: flex; align-items: center; gap: 10px; }
  .report .rp-logo { width: 44px; height: 44px; }
  .report .rp-title { font-size: 40px; font-weight: 800; margin: 4px 0 12px; letter-spacing: .04em; }
  .report .rp-chips { display: flex; gap: 10px; }
  .report .rp-chips span { background: rgba(255, 255, 255, .22); border-radius: 999px; padding: 4px 16px; font-weight: 800; font-size: 15px; }
  .report .rp-body { padding: 24px 40px 8px; }
  .report .rp-pods { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; margin-bottom: 22px; }
  .report .rp-pod { border-radius: 26px; padding: 16px 20px; text-align: center; }
  .report .rp-pod.gold { background: linear-gradient(135deg, #ffe27a, #ffc93c); color: #4a3200; }
  .report .rp-pod.silver { background: linear-gradient(135deg, #f3f6f9, #d3dbe4); color: #2c3742; }
  .report .rp-medal { font-size: 44px; line-height: 1.1; }
  .report .rp-podname { font-size: 28px; font-weight: 800; }
  .report .rp-pod.silver .rp-podname { font-size: 24px; }
  .report .rp-podsub { font-size: 14px; font-weight: 700; opacity: .8; }
  .report .rp-podyen { font-size: 30px; font-weight: 800; }
  .report .rp-podyen small { font-size: 16px; margin-left: 2px; }
  .report .rp-table { width: 100%; border-collapse: separate; border-spacing: 0 5px; font-size: 16px; }
  .report .rp-table th { background: none; color: #137a48; font-size: 13px; font-weight: 800; padding: 0 10px 2px; position: static; text-align: center; }
  .report .rp-table td { padding: 6px 10px; text-align: center; background: #f2f9f0; border: none; }
  .report .rp-table td:first-child { border-radius: 14px 0 0 14px; }
  .report .rp-table td:last-child { border-radius: 0 14px 14px 0; }
  .report .rp-table .l { text-align: left; }
  .report .rp-table .nm { font-weight: 800; font-size: 17px; }
  .report .rp-table .net { font-weight: 800; font-size: 19px; }
  .report .rp-table tr.g td { background: #fff3cc; }
  .report .rp-table tr.s td { background: #eef2f6; }
  .report .rp-badge {
    display: inline-flex; width: 30px; height: 30px; border-radius: 50%; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; background: #ffffff; color: #6b7c70;
  }
  .report .rp-badge.r1 { background: #ffc93c; color: #5a3d00; }
  .report .rp-badge.r2 { background: #b9c4cf; color: #ffffff; }
  .report .rp-badge.r3 { background: #e39a5c; color: #ffffff; }
  .report .rp-down { background: #ffe3ec; color: #d6335f; border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
  .report .rp-memo { margin-top: 10px; font-size: 13px; color: #6b7c70; }
  .report .rp-foot { padding: 10px 40px 26px; font-size: 12px; color: #6b7c70; text-align: right; }

  @media (max-width: 400px) {
    header { gap: 6px; }
    header h1 { font-size: 17px; letter-spacing: .02em; }
    .year-pill { font-size: 13px; padding: 3px 8px; }
    #adminBtn { font-size: 12px; padding: 5px 10px; }
  }
  @media (max-width: 360px) {
    header .logo { display: none; }
  }
  @media (min-width: 700px) {
    header { border-radius: 0 0 24px 24px; }
    main { padding-block-start: 22px; }
  }
  @media print {
    header, nav, .noprint { display: none !important; }
    .scroll { max-height: none; }
    main { padding-block: 0; }
    .scroll { overflow: visible; box-shadow: none; }
  }
</style>
</head>
